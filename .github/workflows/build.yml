# 用 ubuntu 26.04 的 runner 编译本 feed 的三个包，同时产出 ipk 和 apk：
#
#   honk            honk-core（Rust + eBPF，内嵌 doona 面板）
#   luci-app-honk   LuCI 页面和它的中文翻译（架构无关）
#   vmlinux-btf     按 target 内核生成的 BTF，包版本就是内核版本
#
# apk 用 OpenWrt 25.12.x 的 SDK，ipk 用 24.10.x 的 SDK：两种包格式来自两个
# 不同的包管理器，SDK 不通用。矩阵是 (格式 × 架构)，由 plan 作业按输入算出来，
# 一个 job 下一次 SDK，把三个包都编出来。
#
# 每个包都从一个只放它自己的临时 feed 目录编译：这样 OpenWrt 不会顺着 DEPENDS
# 把同仓库的另一个包（比如 honk → vmlinux-btf）一起拉进来编。
#
# GitHub Actions 工作流。
# runs-on: ubuntu-26.04 用的是 GitHub 托管的 26.04 镜像；如果这个标签还没上线，
# 换成 ubuntu-latest 或 ubuntu-24.04。
name: build

# publish 作业要把软件源推到 apk 分支，需要写 contents
permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      honk_ref:
        description: 'honk 上游 tag（例如 v0.1.0-beta.6）'
        required: false
        default: 'v0.1.0-beta.6'
      apk_version:
        description: 'apk 用的 OpenWrt 版本（25.12.x）'
        required: false
        default: '25.12.6'
      ipk_version:
        description: 'ipk 用的 OpenWrt 版本（24.10.x）'
        required: false
        default: '24.10.8'
      formats:
        description: '要构建的格式，逗号分隔：apk / ipk / apk,ipk'
        required: false
        default: 'apk,ipk'
      arches:
        description: '要构建的架构，逗号分隔；all 表示全部'
        required: false
        default: 'all'

jobs:
  # (格式 × 架构) 组合要能按输入裁剪，而 GitHub 不允许在 job 级
  # if 里引用 matrix，所以先在一个作业里算出矩阵，再用 fromJSON 交给 build
  plan:
    name: 规划构建矩阵
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_apk: ${{ steps.plan.outputs.has_apk }}
      has_ipk: ${{ steps.plan.outputs.has_ipk }}
    steps:
      - name: 计算要构建的 (格式, 架构) 组合
        id: plan
        env:
          FORMATS_IN: ${{ inputs.formats }}
          ARCHES_IN: ${{ inputs.arches }}
        run: |
          set -eu
          matrix="$(python3 - "${FORMATS_IN:-apk,ipk}" "${ARCHES_IN:-all}" <<'PY'
          import json
          import sys

          # OpenWrt arch -> (target, subtarget, 内核架构)
          targets = {
              'x86_64':             ('x86',      '64',      'x86_64'),
              'aarch64_generic':    ('armsr',    'armv8',   'arm64'),
              'aarch64_cortex-a53': ('mediatek', 'filogic', 'arm64'),
              'aarch64_cortex-a72': ('bcm27xx',  'bcm2711', 'arm64'),
              'aarch64_cortex-a76': ('bcm27xx',  'bcm2712', 'arm64'),
          }

          formats = [f.strip() for f in sys.argv[1].split(',') if f.strip()]
          arches = [a.strip() for a in sys.argv[2].split(',') if a.strip()]
          if not formats or any(f not in ('apk', 'ipk') for f in formats):
              sys.exit('formats 只能是 apk / ipk，收到：%s' % sys.argv[1])
          if 'all' in arches:
              arches = list(targets)
          for arch in arches:
              if arch not in targets:
                  sys.exit('未知架构 %s，可选：%s' % (arch, ', '.join(targets)))

          include = []
          for fmt in formats:
              for arch in arches:
                  target, subtarget, kernel_arch = targets[arch]
                  include.append({
                      'format': fmt,
                      'openwrt_arch': arch,
                      'openwrt_target': target,
                      'openwrt_subtarget': subtarget,
                      'kernel_arch': kernel_arch,
                  })
          print(json.dumps({'include': include}))
          PY
          )"
          echo "$matrix" | python3 -c 'import json,sys; print("组合:", ", ".join(i["format"]+"/"+i["openwrt_arch"] for i in json.load(sys.stdin)["include"]))'
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          # 只有编了 apk 才需要发软件源分支
          echo "$matrix" | python3 -c 'import json,sys; d=json.load(sys.stdin)["include"]; print("has_apk=%s" % ("true" if any(i["format"]=="apk" for i in d) else "false")); print("has_ipk=%s" % ("true" if any(i["format"]=="ipk" for i in d) else "false"))' >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.format }} · ${{ matrix.openwrt_arch }}
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      FORMAT: ${{ matrix.format }}
      OPENWRT_TARGET: ${{ matrix.openwrt_target }}
      OPENWRT_SUBTARGET: ${{ matrix.openwrt_subtarget }}
      OPENWRT_ARCH: ${{ matrix.openwrt_arch }}
      KERNEL_ARCH: ${{ matrix.kernel_arch }}
    steps:
      - name: 检出本仓库（feed）
        uses: actions/checkout@v7
        with:
          # luci.mk 用最后一次改动包目录的 commit 算版本号，浅克隆会把它算成当前 commit
          fetch-depth: 0

      - name: 解析版本号
        env:
          HONK_REF_IN: ${{ inputs.honk_ref }}
          APK_VERSION_IN: ${{ inputs.apk_version }}
          IPK_VERSION_IN: ${{ inputs.ipk_version }}
        run: |
          set -eu
          ref="${HONK_REF_IN:-v0.1.0-beta.6}"
          if [ "$FORMAT" = "apk" ]; then
            ver="${APK_VERSION_IN:-25.12.6}"
          else
            ver="${IPK_VERSION_IN:-24.10.8}"
          fi
          # v0.1.0-beta.6 -> 0.1.0_beta6：apk/opkg 的版本号里 "-" 后面跟 commit
          # 会被当成预发布后缀，所以上游用 _beta 拼版本号
          pkgver="$(printf '%s' "$ref" | sed -e 's/^v//' -e 's/-beta\./_beta/' -e 's/-/_/g')"

          # luci.mk 在有 .git 时用 <yy>.<年内第几天>.<当天秒数>~<sha7> 当版本，
          # 固件里编进去的就是这种（26.315.48366~2b0dd94）。CI 的临时 feed 目录没有
          # .git，会退回 0.<YYYYMMDD>.<秒> —— 比固件里的版本小，apk 就永远认为我们的
          # 包是降级、也就永远检测不到更新。所以这里按同一格式从提交时间算一遍。
          # 注意 tag 里不能出现 ~，发布 Release 时会把 ~ 换成 -；检测更新时两边都会
          # 归一化后比较（见 luci-app-honk/root/usr/libexec/honk-pkg 的 version_cmp）。
          ts=$(git log -1 --format=%ct)
          luci_ver="$(date -u --date="@$ts" '+%y.%j').$(printf '%05d' $((ts % 86400)))~$(git rev-parse --short=7 HEAD)"

          echo "格式: ${FORMAT}，OpenWrt ${ver}，honk ${ref}（包版本 ${pkgver}），luci ${luci_ver}"
          {
            echo "OPENWRT_VERSION=${ver}"
            echo "HONK_REF=${ref}"
            echo "HONK_VERSION=${pkgver}"
            echo "LUCI_APP_VERSION=${luci_ver}"
          } >> "$GITHUB_ENV"

      - name: 安装构建依赖
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"

          apt_retry() {
            for i in 1 2 3 4 5; do
              "$@" && return 0
              echo "::warning::第 $i 次失败，10 秒后重试：$*"
              sleep 10
            done
            return 1
          }

          # GitHub 托管 runner 在 Azure 里，默认源是 security.ubuntu.com，偶发 DNS 抽风
          # （Temporary failure resolving）会把整步拖死十分钟后失败。默认源重试几次还不通，
          # 就换成 Azure 的镜像再来。
          if ! apt_retry sudo -E apt-get $APT_OPTS update; then
            echo "::warning::默认源不通，换 azure.archive.ubuntu.com"
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              echo 'http://azure.archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
              [ -f "$f" ] || continue
              sudo sed -i -E 's#https?://(security\.|)(archive\.)?ubuntu\.com#http://azure.archive.ubuntu.com#g' "$f" || true
            done
            apt_retry sudo -E apt-get $APT_OPTS update
          fi

          # dwarves 提供 pahole（BTF 编码），clang/libclang 供 bindgen，
          # 其余是 SDK 的 make 和 honk 的 CMake / BoringSSL 需要的
          apt_retry sudo -E apt-get $APT_OPTS install -y --no-install-recommends \
            build-essential bzip2 ca-certificates clang cmake curl dwarves file gawk git \
            libbpf-dev libclang-dev llvm openssl pkg-config python3 rsync unzip xz-utils zstd

      - name: 下载并解压 OpenWrt SDK
        run: bash scripts/fetch-openwrt-sdk.sh

      - name: 准备 honk 源码和本地 feed
        run: |
          set -eu
          feed="$RUNNER_TEMP/feed"
          mkdir -p "$feed/honk"
          cp -a honk/Makefile honk/build.sh honk/files "$feed/honk/"
          # 上游源码不进本仓库，编译前拉到包目录的 src 下（Makefile 就找那里）
          git clone --quiet --depth 1 --branch "$HONK_REF" \
            https://github.com/daeuniverse/honk "$feed/honk/src"
          git -C "$feed/honk/src" log -1 --oneline
          {
            echo "FEED_DIR=${feed}"
            echo "HONK_SRC_DIR=${feed}/honk/src"
          } >> "$GITHUB_ENV"

      - name: 安装 honk 需要的 Rust 工具链
        run: |
          set -eu
          # 两个 toolchain 版本都由 honk 自己钉在 rust-toolchain.toml 里
          stable="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' "$HONK_SRC_DIR/rust-toolchain.toml")"
          ebpf="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' "$HONK_SRC_DIR/crates/honk-ebpf/rust-toolchain.toml")"
          case "$OPENWRT_ARCH" in
            x86_64)   target=x86_64-unknown-linux-musl ;;
            aarch64*) target=aarch64-unknown-linux-musl ;;
            *)        echo "::error::不支持的架构 ${OPENWRT_ARCH}"; exit 1 ;;
          esac

          if [ -f "$HOME/.cargo/env" ]; then
            . "$HOME/.cargo/env"
          fi
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
            . "$HOME/.cargo/env"
          fi
          rustup toolchain install "$stable" --profile minimal --target "$target"
          rustup toolchain install "$ebpf" --profile minimal --component rust-src --component llvm-tools

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "stable=${stable} ebpf=${ebpf} target=${target}"

      - name: 安装钉住版本的 bpf-linker
        run: |
          set -eu
          . "$HONK_SRC_DIR/.github/ci/pins.env"
          tmp="$(mktemp -d)"
          curl -fsSL --retry 3 -o "$tmp/bpf-linker.tar.zst" \
            "https://github.com/aya-rs/bpf-linker/releases/download/v${BPF_LINKER_VERSION}/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          echo "${BPF_LINKER_SHA256}  $tmp/bpf-linker.tar.zst" | sha256sum -c -
          mkdir -p "$HOME/.cargo/bin"
          zstd -dc "$tmp/bpf-linker.tar.zst" | tar -xf - -C "$HOME/.cargo/bin"
          bpf-linker --version

      - name: 编译 honk
        run: |
          set -eu
          cd "$SDK_DIR"
          printf 'src-link local %s\n' "$FEED_DIR" > feeds.conf
          ./scripts/feeds update local
          ./scripts/feeds install -p local honk

          echo 'CONFIG_PACKAGE_honk=m' >> .config
          make defconfig

          HONK_VERSION="$HONK_VERSION" HONK_GIT_TAG="$HONK_REF" \
            make package/honk/compile V=s

      - name: 生成 BTF 并打包 vmlinux-btf
        run: |
          set -eu
          bash scripts/build-btf.sh
          . "$RUNNER_TEMP/btf/vars"

          cp -a vmlinux-btf "$FEED_DIR/vmlinux-btf"
          cd "$SDK_DIR"
          ./scripts/feeds update local
          ./scripts/feeds install -p local vmlinux-btf

          echo 'CONFIG_PACKAGE_vmlinux-btf=m' >> .config
          make defconfig

          # 包版本就是内核版本，vmlinux-<release> 软链接用 UTS_RELEASE
          VMLINUX_BTF_VERSION="$KERNEL_VERSION" \
          VMLINUX_BTF_KERNEL_RELEASE="$KERNEL_RELEASE" \
          VMLINUX_BTF_SRC="$RUNNER_TEMP/btf/vmlinux" \
            make package/vmlinux-btf/compile V=s

      - name: 编译 luci-app-honk 和翻译
        run: |
          set -eu
          # 单独一个 feed：这里不能有 honk，否则它的 kmod 依赖会把整个内核拉进来编
          luci_feed="$RUNNER_TEMP/feed-luci"
          rm -rf "$luci_feed"
          mkdir -p "$luci_feed"
          cp -a luci-app-honk "$luci_feed/"

          cd "$SDK_DIR"
          # 24.10 的 feeds.conf.default 用 src-git-full 引 base（openwrt.git，提供
          # rpcd、ucode、liblua…），25.12 是 src-git --root=package base，两种都认
          {
            grep -E '^src-git(-full)? (--root=[^ ]+ )?(base|luci) ' feeds.conf.default
            printf 'src-link local %s\n' "$luci_feed"
          } > feeds.conf
          feeds=""
          for f in base luci; do
            if grep -qE "^src-git(-full)? (--root=[^ ]+ )?${f} " feeds.conf.default; then
              feeds="$feeds $f"
            fi
          done
          # shellcheck disable=SC2086 # feeds 是有意拼成参数列表的
          ./scripts/feeds update $feeds local
          # po2lmo、jsmin 这些主机工具只有把 luci-base 装进 package 树才会编
          ./scripts/feeds install -p luci luci-base
          ./scripts/feeds install -p local luci-app-honk

          rm -f .config
          make defconfig

          # 翻译包和 luci-app-honk 由同一个 Makefile 定义，编这个目录就会一起出来；
          # 它们默认只按固件语言选择，所以在命令行上显式打开
          LUCI_APP_VERSION="$LUCI_APP_VERSION" \
          make package/luci-app-honk/compile V=s \
               CONFIG_PACKAGE_luci-app-honk=m \
               CONFIG_PACKAGE_luci-i18n-honk-zh-cn=m \
               CONFIG_PACKAGE_luci-i18n-honk-zh-tw=m

      - name: 给 apk 签名（可选）
        env:
          APK_PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
        run: |
          set -eu
          if [ "$FORMAT" != "apk" ]; then
            echo "ipk 没有签名机制，跳过"
            exit 0
          fi
          bash scripts/sign-apk.sh

      - name: 收集产物
        run: |
          set -eu
          mkdir -p dist
          find "$SDK_DIR/bin/packages" -path '*/local/*' -type f \
            \( -name '*.apk' -o -name '*.ipk' \) -exec cp -v -t dist {} +
          cd dist
          # apk 的文件名里没有架构，多个架构合并进 Release 会互相覆盖，补个后缀；
          # ipk 本来就带（_x86_64 / _all）
          if [ "$FORMAT" = "apk" ]; then
            for f in *.apk; do
              mv "$f" "${f%.apk}-${OPENWRT_ARCH}.apk"
            done
          fi
          ls -l
          # 校验文件名带上格式和架构，多个 artifact 合并时不会撞名
          sha256sum * > "SHA256SUMS-${FORMAT}-${OPENWRT_ARCH}"
          cat "SHA256SUMS-${FORMAT}-${OPENWRT_ARCH}"

      - name: 生成 apk 软件源索引（带签名）
        if: matrix.format == 'apk'
        env:
          APK_PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
        run: |
          set -eu
          apk="$SDK_DIR/staging_dir/host/bin/apk"
          dir="dist/repo/$OPENWRT_ARCH"
          mkdir -p "$dir"
          # 索引里的文件名要和实际文件对得上，把给 Release 加的架构后缀去掉
          for f in dist/*-"$OPENWRT_ARCH".apk; do
            base=$(basename "$f")
            cp "$f" "$dir/${base%-$OPENWRT_ARCH.apk}.apk"
          done
          if [ -n "${APK_PRIVATE_KEY:-}" ]; then
            key="$RUNNER_TEMP/apk-sign.key"
            printf '%s\n' "$APK_PRIVATE_KEY" > "$key"
            chmod 600 "$key"
            # 公钥直接从私钥推出来：仓库里的那份只用于对照，避免 secret 里的私钥
            # 和入库的公钥不是一对（那样客户端一律 UNTRUSTED）
            openssl ec -in "$key" -pubout -out "$RUNNER_TEMP/key-build.pem" 2>/dev/null ||
              { echo "::error::APK_PRIVATE_KEY 不是有效的 EC 私钥"; exit 1; }
            echo "私钥 sha256: $(sha256sum "$key" | cut -d' ' -f1)"
            echo "推导公钥 sha256: $(sha256sum "$RUNNER_TEMP/key-build.pem" | cut -d' ' -f1)"
            APK="$apk" sh scripts/apk-repo.sh "$dir" "$key"
            mkdir -p "$RUNNER_TEMP/keys"
            cp "$RUNNER_TEMP/key-build.pem" "$RUNNER_TEMP/keys/key-build.pem"
            "$apk" verify --keys-dir "$RUNNER_TEMP/keys" "$dir/packages.adb"
            cp "$RUNNER_TEMP/key-build.pem" dist/repo/key-build.pem
            if ! cmp -s "$RUNNER_TEMP/key-build.pem" key/key-build.pem; then
              echo "::warning::secret 里的私钥和仓库 key/key-build.pem 不是一对，分支里放的是推导出来的公钥"
            fi
          else
            echo "::warning::没配 secret APK_PRIVATE_KEY，索引未签名，客户端要 apk add --allow-untrusted"
            APK="$apk" sh scripts/apk-repo.sh "$dir"
          fi
          ls -l "$dir"

      - name: 生成 ipk 软件源索引（带签名）
        if: matrix.format == 'ipk'
        env:
          USIGN_PRIVATE_KEY: ${{ secrets.USIGN_PRIVATE_KEY }}
        run: |
          set -eu
          usign="$SDK_DIR/staging_dir/host/bin/usign"
          dir="dist/repo/$OPENWRT_ARCH"
          mkdir -p "$dir"
          cp dist/*.ipk "$dir/"
          if [ -n "${USIGN_PRIVATE_KEY:-}" ]; then
            key="$RUNNER_TEMP/usign.key"
            printf '%s\n' "$USIGN_PRIVATE_KEY" > "$key"
            chmod 600 "$key"
            USIGN="$usign" sh scripts/ipk-repo.sh "$dir" "$key"
            "$usign" -V -m "$dir/Packages" -p key/key-build.pub -x "$dir/Packages.sig"
          else
            echo "::warning::没配 secret USIGN_PRIVATE_KEY，索引未签名，客户端要关掉 check_signature"
            USIGN="$usign" sh scripts/ipk-repo.sh "$dir"
          fi
          ls -l "$dir"

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.format }}-${{ matrix.openwrt_arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # 把每个架构的包和签名索引堆到一个 apk 分支上，路由器就能把它当普通 apk 源：
  #   https://raw.githubusercontent.com/<owner>/<repo>/apk/<arch>/packages.adb
  # 这样 LuCI 里的一键安装和检测更新都走 apk 自己那套签名校验，不用 --allow-untrusted。
  publish:
    name: 发布软件源分支
    needs: [ plan, build ]
    if: needs.plan.outputs.has_apk == 'true' || needs.plan.outputs.has_ipk == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # 源发布失败不该让整轮变红：Release 那边照样有包
    continue-on-error: true
    steps:
      - name: 检出本仓库（拿公钥）
        uses: actions/checkout@v7

      - name: 下载各架构产物
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: 组装 apk / ipk 分支
        run: |
          set -eu
          rm -rf out
          mkdir -p out/apk out/ipk

          # apk（25.x）：各架构的 .apk + packages.adb + index.json
          for d in artifacts/packages-apk-*; do
            [ -d "$d" ] || continue
            arch=${d##*packages-apk-}
            [ -d "$d/repo/$arch" ] || continue
            mkdir -p "out/apk/$arch"
            cp -a "$d/repo/$arch/." "out/apk/$arch/"
            echo "apk/$arch: $(ls -1 "out/apk/$arch" | wc -l) 个文件"
          done
          # 公钥用各 job 从私钥推导出来的那份（和索引签名必然配对）
          pem=$(ls artifacts/packages-apk-*/repo/key-build.pem 2>/dev/null | head -1)
          if [ -n "$pem" ]; then
            cp "$pem" out/apk/key-build.pem
          elif [ -f key/key-build.pem ]; then
            cp key/key-build.pem out/apk/key-build.pem
            echo "::warning::apk 产物里没有公钥，用了仓库里的 key/key-build.pem"
          fi

          # ipk（24.x）：各架构的 .ipk + Packages(/.gz/.sig)
          for d in artifacts/packages-ipk-*; do
            [ -d "$d" ] || continue
            arch=${d##*packages-ipk-}
            [ -d "$d/repo/$arch" ] || continue
            mkdir -p "out/ipk/$arch"
            cp -a "$d/repo/$arch/." "out/ipk/$arch/"
            echo "ipk/$arch: $(ls -1 "out/ipk/$arch" | wc -l) 个文件"
          done
          [ -f key/key-build.pub ] && cp key/key-build.pub out/ipk/key-build.pub

          find out -maxdepth 2 -type f | sort | head -30

      - name: 推到 apk / ipk 分支
        env:
          TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          url=$(printf '%s' "$SERVER_URL/$REPO.git" |
            sed -E "s#^(https?)://#\1://x-access-token:${TOKEN}@#")
          for branch in apk ipk; do
            [ -d "out/$branch" ] || continue
            [ -n "$(ls -A "out/$branch")" ] || continue
            cd "out/$branch"
            git init -q -b "$branch"
            git add -A
            git -c user.name=ci -c user.email=ci@users.noreply.github.com \
              commit -q -m "repo: $SHA 的 $branch 软件源"
            git push -f "$url" "$branch"
            cd - >/dev/null
            echo "已推送 $branch 分支"
          done

      # 检测更新走 GitHub Releases API（和 passwall 一样），所以每次构建都要留一个
      # release：tag 用 luci-app-honk 的版本（~ 不能出现在 git tag 里，换成 -）
      - name: 发布 Release
        if: github.server_url == 'https://github.com'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          ver=""
          for d in out/apk/*/; do
            arch=$(basename "$d")
            f=$(ls "$d"luci-app-honk-"$arch"-*.apk 2>/dev/null | head -1)
            [ -n "$f" ] || f=$(ls "$d"luci-app-honk-*.apk 2>/dev/null | head -1)
            [ -n "$f" ] || continue
            b=$(basename "$f" .apk)
            b=${b#luci-app-honk-}
            ver=${b%-"$arch"}
            break
          done
          [ -n "$ver" ] || { echo "没有 apk 产物，跳过 Release"; exit 0; }
          tag=$(printf '%s' "$ver" | tr '~' '-')
          echo "release tag: $tag"

          mkdir -p out/release
          cp out/apk/*/*.apk out/ipk/*/*.ipk out/release/ 2>/dev/null || true
          echo "资产数: $(ls -1 out/release | wc -l)"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/release/* --clobber
            echo "release $tag 已存在，资产已更新"
          else
            gh release create "$tag" out/release/* \
              --title "honk $tag" \
              --notes "CI 构建（${SHA:0:7}）：honk / luci-app-honk / vmlinux-btf，ipk 与 apk 两种格式。" \
              --target "$SHA" \
              --latest
            echo "release $tag 创建完成"
          fi
